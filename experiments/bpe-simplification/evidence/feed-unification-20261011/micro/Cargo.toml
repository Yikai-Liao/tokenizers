[package]
name = "bpe-feed-micro"
version = "0.1.0"
edition = "2024"
[dependencies]
tk-encode = { path = "/tmp/bpe-feed-baseline/tokenizers/tk-encode", default-features = false, features = ["parallelism"] }
ahash = { version = "=0.8.12", features = ["serde"] }
compact_str = { version = "=0.9.1", features = ["serde"] }
scc = "=3.8.8"
serde = { version = "1", features = ["derive"] }
rayon = "=1.12.0"
libc = "0.2"
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
